name: Audit and Build Versioned MRS
on:
  schedule:
    - cron: '0 23 * * *'
  push:
    branches: [main, codex/four-source-mrs]
    paths: ['personal/**', 'scripts/**', 'runtime/**', 'tests/**', 'NOTICE.md', '.github/workflows/sync.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_count_change:
        description: 'Permit reviewed >20% count changes for this run only'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-mrs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and unit tests
        run: |
          python3 -m pip install 'PyYAML==6.0.2' 'zstandard==0.24.0'
          python3 -m unittest discover -s tests -v
      - name: Install pinned Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v1.19.32 --repo MetaCubeX/mihomo --pattern 'mihomo-linux-amd64-compatible-v1.19.32.gz' --output mihomo.gz
          gzip -t mihomo.gz
          gzip -dc mihomo.gz > "$RUNNER_TEMP/mihomo"
          sudo install -m 0755 "$RUNNER_TEMP/mihomo" /usr/local/bin/mihomo
          test -x /usr/local/bin/mihomo
          /usr/local/bin/mihomo -v
      - name: Build pinned four-source snapshot and legacy compatibility output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: rules-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/four_sources.py --mihomo /usr/local/bin/mihomo
          loyal_sha="$(python3 -c 'import json; print(json.load(open("out/build-manifest.json"))["sources"]["loyal"]["commit"])')"
          mv out snapshot-out
          BASE_URL="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/$loyal_sha" bash scripts/build.sh
          test "$(find out/loyalsoldier -maxdepth 1 -name '*.mrs' | wc -l)" -eq 13
          /usr/local/bin/mihomo -t -d "$PWD" -f out/smoke.yaml
          mv out compat-out
          mv snapshot-out out
          python3 scripts/test_core.py --mihomo /usr/local/bin/mihomo
      - name: Prepare v2 from the same fixed production commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_balanced.py --sources out/sources.json --build-id rules-${{ github.run_id }}-${{ github.run_attempt }}-v2 --mihomo /usr/local/bin/mihomo --prepare-only
      - name: Cache immutable upstream archives
        uses: actions/cache@v4
        with:
          path: .cache/audit
          key: upstream-audit-${{ runner.os }}-${{ hashFiles('balanced-out/sources.json') }}
          restore-keys: upstream-audit-${{ runner.os }}-
      - name: Preserve complete original-source audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          audit_exit=0
          python3 scripts/audit_sources.py --sources balanced-out/sources.json --mihomo /usr/local/bin/mihomo --output audit/original || audit_exit=$?
          # A reported source defect proceeds only to deterministic repair.
          # Tool failures or unreported/unknown errors cannot authorize a build.
          test "$audit_exit" -le 1
          test -f audit/original/manifest.json
      - name: Rebuild defective MRS and audit every effective projection
        run: |
          python3 scripts/repair_sources.py --audit audit/original --sources balanced-out/sources.json --mihomo /usr/local/bin/mihomo --output audit/repairs
          python3 scripts/audit_sources.py --sources balanced-out/sources.json --mihomo /usr/local/bin/mihomo --output audit --repairs audit/repairs
      - name: Build v2 and exercise full rules and DNS in pinned core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_balanced.py --sources balanced-out/sources.json --build-id rules-${{ github.run_id }}-${{ github.run_attempt }}-v2 --mihomo /usr/local/bin/mihomo --audit audit
          python3 scripts/test_core.py --snapshot-dir balanced-out --mihomo /usr/local/bin/mihomo
          python3 scripts/test_dns_core.py --mihomo /usr/local/bin/mihomo
      - name: Upload candidate build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-and-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out
            compat-out
            balanced-out
            audit
          retention-days: 30
      - name: Publish immutable tag, verified Release and candidate pointer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_COUNT_CHANGE: ${{ inputs.allow_count_change }}
        run: |
          python3 scripts/publish_snapshot.py
          python3 scripts/publish_snapshot.py --out balanced-out --audit audit
      - name: Publish preview candidate index
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: candidates
          publish_dir: ./candidate-out
          keep_files: false
          force_orphan: true
      - name: Publish unchanged-format legacy branch and candidate pointer
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./compat-out
          keep_files: false
          force_orphan: true
