name: Sync and Build MRS Rulesets
on:
  schedule:
    - cron: '0 23 * * *'
  push:
    branches: [main]
    paths: ['personal/**', 'scripts/**', 'tests/**', '.github/workflows/sync.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-mrs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python3 -m pip install 'PyYAML==6.0.2'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIHOMO_TAG: v1.19.32
        run: |
          set -euo pipefail
          json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/$MIHOMO_TAG")"
          url="$(jq -r '[.assets[].browser_download_url | select(test("linux-amd64-compatible.*\\.gz$"))][0] // empty' <<<"$json")"
          if [ -z "$url" ]; then
            url="$(jq -r '[.assets[].browser_download_url | select(test("linux-amd64.*\\.gz$"))][0] // empty' <<<"$json")"
          fi
          test -n "$url"
          curl -fsSL --retry 3 -o mihomo.gz "$url"
          gzip -t mihomo.gz
          gzip -dc mihomo.gz > mihomo
          sudo install -m 0755 mihomo /usr/local/bin/mihomo
          mihomo -v
      - name: Build and smoke test
        run: |
          set -euo pipefail
          bash scripts/build.sh
          test "$(find out/loyalsoldier -maxdepth 1 -name '*.mrs' | wc -l)" -eq 13
          mihomo -t -d "$PWD" -f out/smoke.yaml
          cat out/personal/build-report.json
      - name: Publish release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./out
          keep_files: false
          force_orphan: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MRS build ${{ github.run_id }}
          tag_name: build-${{ github.run_id }}-${{ github.run_attempt }}
          files: |
            out/loyalsoldier/*.mrs
            out/personal/*.mrs
            out/personal/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
